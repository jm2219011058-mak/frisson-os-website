<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sensory World Lab — FRISSON</title>
<meta name="description" content="Sensory World Lab — Frisson's laboratory of sensory identity.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/type.css">
<style>
  :root{
    --bg:#ffffff;--ink:#2b1d12;--ink-soft:#5b4a3b;--accent:#e07b3c;--hair:rgba(43,29,18,.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;overflow-x:clip;}
  body{overflow-x:clip;background:#f7f5f3;color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased;}

  /* the artwork runs the full viewport — the nav floats on top of it */
  /* the plate is portrait — the section takes its native ratio so nothing gets cropped */
  .swl{position:relative;width:100%;aspect-ratio:1040/1512;min-height:100svh;overflow:hidden;background:#f7f5f3;}
  .swl-bg{position:absolute;inset:0;z-index:0;display:block;}
  .swl-bg img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;}

  /* nav — transparent, sits over the artwork */
  .nav{position:absolute;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;justify-content:space-between;
    padding:18px clamp(20px,5vw,64px);background:transparent;}
  .nav .brand{font-family:"Playfair Display","Noto Serif SC",serif;font-size:clamp(18px,2.4vw,24px);letter-spacing:.14em;color:var(--ink);text-decoration:none;font-weight:500;}
  .nav .brand .o{color:var(--accent);}
  .nav .links{display:flex;gap:clamp(18px,3vw,46px);}
  .nav .links a{font-family:var(--sans);font-size:clamp(12px,1.1vw,15px);letter-spacing:.02em;color:var(--ink);text-decoration:none;transition:color .25s;white-space:nowrap;}
  .nav .links a:hover,.nav .links a.cur{color:var(--accent);}
  .menu-btn{display:none;flex-direction:column;justify-content:center;gap:6px;width:36px;height:36px;background:transparent;border:0;cursor:pointer;padding:0;}
  .menu-btn span{display:block;width:24px;height:2px;background:#2b1d12;border-radius:2px;transition:transform .3s;}
  .menu-btn.open span:nth-child(1){transform:translateY(4px) rotate(45deg);}
  .menu-btn.open span:nth-child(2){transform:translateY(-4px) rotate(-45deg);}
  @media(min-width:681px){.menu{display:none;}}
  @media (max-width:680px){ .nav .links{display:none;} .menu-btn{display:flex;} }

  /* mobile menu — house pattern: full-screen paper sheet, quiet editorial links */
  .menu{display:flex;position:fixed;inset:0;margin:0;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(22px,5vh,44px);background:#fff;z-index:55;
    opacity:0;pointer-events:none;transition:opacity .32s cubic-bezier(0.25,0.1,0.25,1);}
  .menu.open{opacity:1;pointer-events:auto;}
  .menu a{color:#2b1d12;text-decoration:none;
    font-family:var(--serif);font-weight:400;font-size:clamp(23px,5.8vw,32px);letter-spacing:.012em;line-height:1.18;
    opacity:0;transform:translateY(12px);transition:opacity .4s ease,transform .55s cubic-bezier(0.25,0.1,0.25,1),color .25s;}
  .menu.open a{opacity:1;transform:none;}
  .menu a:hover,.menu a:active{color:var(--accent);}
  .nav .brand,.nav .menu-btn{position:relative;z-index:60;}

  .swl-stage{position:relative;display:inline-block;}
  .swl-title{font-family:var(--serif);font-weight:700;color:#0b0a09;margin:0;cursor:default;
    font-size:clamp(64px,min(21vw,24vh),300px);line-height:1.14;letter-spacing:-.02em;
    transition:opacity .3s ease;}
  .swl-stage.dissolving .swl-title{opacity:0;transition:opacity .12s ease;}
  /* dust canvas sits exactly over the words (§5.5: one layer, rAF only while it moves) */
  .swl-dust{position:absolute;left:0;top:0;pointer-events:none;opacity:0;}
  .swl-stage.dissolving .swl-dust{opacity:1;}
  /* the title — as large as the canvas allows, centred over the artwork */
  .swl-cap{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:clamp(56px,8vh,92px) clamp(16px,3vw,40px);}   /* centres on the plate itself, not the viewport */


  /* the three layers — plain white, one big name per line */
  .swl-layers{background:#fff;padding:clamp(110px,18vh,230px) clamp(24px,6vw,72px);}
  .swl-layers-in{max-width:1180px;margin:0 auto;
    display:flex;flex-direction:column;gap:clamp(48px,9vh,120px);}
  .swl-layer{font-family:var(--serif);font-weight:700;color:#0b0a09;margin:0;
    font-size:clamp(30px,5.2vw,76px);line-height:1.1;letter-spacing:-.012em;text-align:center;}
  /* a layer that carries an image: name left, artwork right */
  .swl-row{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:clamp(24px,5vw,72px);}
  .swl-row .swl-layer{text-align:left;}
  .swl-row-fig{margin:0;}
  .swl-row-fig img{display:block;width:100%;height:auto;}
  /* a layer whose artwork sits under its name */
  .swl-stack{display:flex;flex-direction:column;align-items:center;gap:clamp(26px,4.5vh,54px);}
  .swl-stack-fig{margin:0;width:min(620px,100%);}
  .swl-stack-fig img{display:block;width:100%;height:auto;}
  @media(max-width:760px){
    .swl-row{grid-template-columns:1fr;gap:clamp(22px,4vh,36px);}
    .swl-row .swl-layer{text-align:center;}
  }
</style>
</head>
<body>

  <section class="swl">
    <picture class="swl-bg">
      <source type="image/webp" srcset="assets/city/swl-bg2-900.webp 900w, assets/city/swl-bg2.webp 1040w" sizes="100vw">
      <img src="assets/city/swl-bg2.webp" alt="" width="1040" height="1512" fetchpriority="high" decoding="async">
    </picture>

    <nav class="nav">
      <a class="brand" href="index.html">FRISS<span class="o">O</span>N</a>
      <div class="links">
        <a href="soulful-living-network">{{nav.cities}}</a>
        <a href="sona.html">{{nav.sona}}</a>
        <a href="founding-catalysts">{{nav.advocater}}</a>
        <a href="field-notes">{{nav.stories}}</a>
        <a href="sensory-lab" class="cur">{{nav.lab}}</a>
      </div>
      <button class="menu-btn" id="menuBtn" aria-label="Menu"><span></span><span></span></button>
      <div class="menu" id="menu">
        <a href="soulful-living-network">{{nav.cities}}</a>
        <a href="sona.html">{{nav.sona}}</a>
        <a href="founding-catalysts">{{nav.advocater}}</a>
        <a href="field-notes">{{nav.stories}}</a>
        <a href="sensory-lab">{{nav.lab}}</a>
      </div>
      <!--LANGNAV-->
    </nav>

    <div class="swl-cap">
      <div class="swl-stage" id="swlStage">
        <h1 class="swl-title" id="swlTitle">Sensory World<br>Lab</h1>
        <canvas class="swl-dust" id="swlDust" aria-hidden="true"></canvas>
      </div>
    </div>
  </section>



  <section class="swl-layers">
    <div class="swl-layers-in">
      <div class="swl-row">
        <h2 class="swl-layer">Human Layer</h2>
        <figure class="swl-row-fig"><img src="assets/city/layer-human.webp?v=2" alt="" width="1170" height="1463" loading="lazy" decoding="async"></figure>
      </div>
      <div class="swl-stack">
        <h2 class="swl-layer">Outlier Layer</h2>
        <figure class="swl-stack-fig"><img src="assets/city/layer-outlier.webp" alt="" width="573" height="528" loading="lazy" decoding="async"></figure>
      </div>
      <div class="swl-stack">
        <h2 class="swl-layer">Adaptive Layer</h2>
        <figure class="swl-stack-fig"><img src="assets/city/layer-adaptive.webp" alt="" loading="lazy" decoding="async"></figure>
      </div>
    </div>
  </section>

  <script>
    /* hover → the words break into fine pink dust and drift away; leaving pulls them home.
       §5.5: one canvas, rAF only while particles move, reduced-motion opts out entirely. */
    (function(){
      var stage=document.getElementById('swlStage'), title=document.getElementById('swlTitle'), cv=document.getElementById('swlDust');
      if(!stage||!title||!cv) return;
      if(matchMedia('(prefers-reduced-motion:reduce)').matches) return;
      var ctx=cv.getContext('2d'), DPR=Math.min(devicePixelRatio||1,2);
      var P=[], W=0,H=0, raf=0, mode='idle', t0=0, built=false;
      var TINTS=['#e82f63','#ff5c86','#d4174a','#ff8fb0','#c2143f'];

      function build(){
        var r=title.getBoundingClientRect();
        W=Math.ceil(r.width); H=Math.ceil(r.height);
        if(!W||!H) return false;
        cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px';
        ctx.setTransform(DPR,0,0,DPR,0,0);
        var scale=Math.min(1,540/W);
        var oc=document.createElement('canvas');
        oc.width=Math.max(1,Math.round(W*scale)); oc.height=Math.max(1,Math.round(H*scale));
        var o=oc.getContext('2d'), cs=getComputedStyle(title);
        var fs=parseFloat(cs.fontSize)*scale, lh=parseFloat(cs.lineHeight)*scale;
        try{ o.letterSpacing=cs.letterSpacing; }catch(e){}
        o.fillStyle='#000'; o.textAlign='center'; o.textBaseline='middle';
        o.font=cs.fontWeight+' '+fs+'px '+cs.fontFamily;
        var lines=['Sensory','World','Lab'], total=lines.length*lh;
        for(var i=0;i<lines.length;i++) o.fillText(lines[i], oc.width/2, (oc.height-total)/2 + lh*(i+0.5));
        var d; try{ d=o.getImageData(0,0,oc.width,oc.height).data; }catch(e){ return false; }
        P.length=0;
        var step=Math.max(1,Math.round(oc.width/300)), inv=1/scale, cx=W/2, cy=H/2;
        for(var y=0;y<oc.height;y+=step)for(var x=0;x<oc.width;x+=step){
          if(d[(y*oc.width+x)*4+3]<110) continue;
          var px=x*inv, py=y*inv;
          var ang=Math.atan2(py-cy,px-cx)+(Math.random()-.5)*1.1, sp=.5+Math.random()*1.9;
          P.push({hx:px,hy:py,x:px,y:py,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-.35,
                  s:inv*(.72+Math.random()*.7), a:1, d:Math.random()*.5,
                  life:1.5+Math.random()*1.4, c:TINTS[(x+y)%TINTS.length]});
        }
        built=true; return P.length>0;
      }
      function tick(ts){
        if(!t0) t0=ts;
        var el=(ts-t0)/1000, alive=false;
        ctx.clearRect(0,0,W,H);
        for(var i=0;i<P.length;i++){
          var p=P[i];
          if(mode==='out'){
            var lt=(el-p.d)/p.life; if(lt<0)lt=0; if(lt<1)alive=true; else lt=1;
            var e=lt*lt;
            p.x=p.hx+p.vx*e*64; p.y=p.hy+p.vy*e*64; p.a=1-lt;
          }else{
            p.x+=(p.hx-p.x)*.075; p.y+=(p.hy-p.y)*.075; p.a+=(1-p.a)*.07;
            if(Math.abs(p.x-p.hx)+Math.abs(p.y-p.hy)>.5||p.a<.97) alive=true;
          }
          if(p.a>.012){ ctx.globalAlpha=p.a; ctx.fillStyle=p.c; ctx.fillRect(p.x,p.y,p.s,p.s); }
        }
        ctx.globalAlpha=1;
        if(alive){ raf=requestAnimationFrame(tick); return; }
        if(mode==='back'){ stage.classList.remove('dissolving'); ctx.clearRect(0,0,W,H); }
        mode='idle'; raf=0;
      }
      function start(m){ if(mode===m) return; mode=m; t0=0; cancelAnimationFrame(raf); raf=requestAnimationFrame(tick); }
      function out(){ if(!built && !build()) return; stage.classList.add('dissolving');
        for(var i=0;i<P.length;i++){ var p=P[i]; p.x=p.hx; p.y=p.hy; p.a=1; } start('out'); }
      function back(){ if(!built) return; start('back'); }
      if(matchMedia('(hover:hover)').matches){
        title.addEventListener('mouseenter',out);
        stage.addEventListener('mouseleave',back);
      }else{
        title.addEventListener('click',function(){ mode==='out'?back():out(); });
      }
      addEventListener('resize',function(){ built=false; if(mode!=='idle'){ cancelAnimationFrame(raf); mode='idle'; stage.classList.remove('dissolving'); } });
      if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){ built=false; });
    })();
    (function(){ var b=document.getElementById('menuBtn'), m=document.getElementById('menu'); if(!b||!m) return;
      b.addEventListener('click',function(){ var o=m.classList.toggle('open'); b.classList.toggle('open',o); });
      m.addEventListener('click',function(){ m.classList.remove('open'); b.classList.remove('open'); });
    })();


  </script>
</body>
</html>
