<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sensory World Lab — FRISSON</title>
<meta name="description" content="Sensory World Lab — Frisson's laboratory of sensory identity.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/type.css">
<!-- imagesrcset so the preload resolves to the SAME candidate the <picture> picks; a bare
     href preloaded 1920w while a 2dppx screen then went and fetched the 2080w original -->
<link rel="preload" as="image" imagesizes="100vw"
      imagesrcset="assets/city/swl-plate-960.webp 960w, assets/city/swl-plate-1440.webp 1440w, assets/city/swl-plate-1920.webp 1920w, assets/city/swl-plate.webp 2080w"
      href="assets/city/swl-plate-1440.webp">
<script defer src="assets/vendor/locomotive/locomotive-scroll.min.js"></script>
<style>
  :root{
    --bg:#ffffff;--ink:#2b1d12;--ink-soft:#5b4a3b;--accent:#e07b3c;--hair:rgba(43,29,18,.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;overflow-x:clip;}
  body{overflow-x:clip;background:#f7f5f3;color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased;}

  /* ---- Locomotive Scroll v5 / Lenis (MIT) — only the rules we actually need ---- */
  html.lenis,html.lenis body{height:auto;}
  html.lenis{scroll-behavior:auto;}                 /* Lenis owns the easing; native smooth fights it */
  .lenis.lenis-stopped{overflow:clip;}
  .lenis [data-lenis-prevent]{overscroll-behavior:contain;}

  .reveal{opacity:0;transform:translateY(22px);transition:opacity 1s ease,transform 1s ease;}
  .reveal.in{opacity:1;transform:none;}

  /* ===========================================================================
     ACT 1 — the plate
     A real hero: exactly one viewport tall. It used to take the plate's native
     1040/1512 portrait ratio at full width, which on a 1280x720 desktop made the
     section 1861px tall and pushed the title 733px BELOW the fold — you landed on
     an empty cream void. The plate now covers a 100svh frame instead; the spray is
     centred in the artwork so the crop keeps the subject.
     =========================================================================== */
  .swl{position:relative;width:100%;height:100svh;min-height:600px;overflow:hidden;background:#f7f5f3;}

  /* The sheet overshoots the frame top and bottom so the parallax drift can never expose
     an edge. Locomotive's --progress is 0 at the top of the document and 1 once the hero has
     scrolled away, so anchoring the drift at 0 means the plate is composed exactly as authored
     on arrival and only lags once you start moving. Budget: the wrap is 120% tall sitting at
     -10%, so it may travel at most 10/120 = 8.33% of its own height before the top edge enters
     the frame; 7% leaves ~1.6% of the hero height as margin against rounding. */
  .swl-sheet{position:absolute;left:0;right:0;top:-10%;height:120%;z-index:0;will-change:transform;
    transform:translate3d(0,calc(var(--progress,0) * 7%),0);}
  .swl-sheet picture,.swl-sheet img{display:block;width:100%;height:100%;}
  .swl-sheet img{object-fit:cover;object-position:center;}

  /* Baked grain, §5.5/§5.8: a tiled data image, never a runtime filter, and multi-SCALE
     (blotch + medium + fine + speckle) because a single frequency reads as digital noise.
     It lives INSIDE the parallax sheet on purpose — the tooth belongs to the paper, and
     keeping it in the same composited layer means the blend rasterises once and then just
     translates, instead of recomputing a full-screen overlay every scrolled frame. */
  .swl-grain{position:absolute;inset:0;pointer-events:none;
    background:url(assets/city/swl-grain.webp) repeat;background-size:256px 256px;
    mix-blend-mode:overlay;opacity:.5;}
  @media (min-resolution:1.5dppx){ .swl-grain{background-size:128px 128px;} }

  /* nav — transparent, sits over the artwork */
  .nav{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;justify-content:space-between;
    padding:18px clamp(20px,5vw,64px);background:transparent;transition:background .3s,border-color .3s;
    border-bottom:1px solid transparent;}
  /* past the hero it firms up into the house bar so it never floats over bare copy */
  .nav.scrolled{background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border-bottom-color:var(--hair);}
  .nav .brand{font-family:"Playfair Display","Noto Serif SC",serif;font-size:clamp(18px,2.4vw,24px);letter-spacing:.14em;color:var(--ink);text-decoration:none;font-weight:500;}
  .nav .brand .o{color:var(--accent);}
  .nav .links{display:flex;gap:clamp(18px,3vw,46px);}
  .nav .links a{font-family:var(--sans);font-size:clamp(12px,1.1vw,15px);letter-spacing:.02em;color:var(--ink);text-decoration:none;transition:color .25s;white-space:nowrap;}
  .nav .links a:hover,.nav .links a.cur{color:var(--accent);}
  .menu-btn{display:none;flex-direction:column;justify-content:center;gap:6px;width:36px;height:36px;background:transparent;border:0;cursor:pointer;padding:0;}
  .menu-btn span{display:block;width:24px;height:2px;background:#2b1d12;border-radius:2px;transition:transform .3s;}
  .menu-btn.open span:nth-child(1){transform:translateY(4px) rotate(45deg);}
  .menu-btn.open span:nth-child(2){transform:translateY(-4px) rotate(-45deg);}
  @media(min-width:681px){.menu{display:none;}}
  @media (max-width:680px){ .nav .links{display:none;} .menu-btn{display:flex;} }

  /* mobile menu — house pattern: translucent frosted sheet, quiet editorial links */
  .menu{display:flex;position:fixed;inset:0;margin:0;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(22px,5vh,44px);background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);z-index:55;
    opacity:0;pointer-events:none;transition:opacity .32s cubic-bezier(0.25,0.1,0.25,1);}
  .menu.open{opacity:1;pointer-events:auto;}
  .menu a{color:#2b1d12;text-decoration:none;
    font-family:var(--serif);font-weight:400;font-size:clamp(23px,5.8vw,32px);letter-spacing:.012em;line-height:1.18;
    opacity:0;transform:translateY(12px);transition:opacity .4s ease,transform .55s cubic-bezier(0.25,0.1,0.25,1),color .25s;}
  .menu.open a{opacity:1;transform:none;}
  .menu a:hover,.menu a:active{color:var(--accent);}
  .nav .brand,.nav .menu-btn{position:relative;z-index:60;}

  /* the title block — centred on the plate, drifting against it as you scroll */
  .swl-cap{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:clamp(92px,12vh,144px) clamp(16px,3vw,40px);
    transform:translate3d(0,calc(var(--progress,0) * -6%),0);}
  .swl-stage{position:relative;display:inline-block;}
  .swl-title{font-family:var(--serif);font-weight:700;color:#0b0a09;margin:0;cursor:default;
    font-size:clamp(64px,min(21vw,24vh),300px);line-height:1.14;letter-spacing:-.02em;
    /* coming back: ease-OUT, the ink arrives fast then settles */
    transition:opacity .52s cubic-bezier(0.16,1,0.3,1);}
  /* Leaving: ease-IN. The printed word holds its weight for a beat and only then lets go,
     which is the same shape the particles use to launch (displacement runs as lt²), so the
     ink and the dust hand over on one curve instead of the old 120ms cut. Both halves are
     A→B gestures, so both are eased — §5.9 reserves linear for looping phase, not this. */
  .swl-stage.dissolving .swl-title{opacity:0;transition:opacity .38s cubic-bezier(0.7,0,0.84,0);}
  /* dust canvas — positioned from the title's own box each build (§5.5: rAF only while it moves).
     Incoming eases OUT and outgoing eases IN — mirrored against the title above, so the pair
     crosses with their sum near 1 and the swap never dips through a flat spot. */
  .swl-dust{position:absolute;left:0;top:0;pointer-events:none;opacity:0;
    transition:opacity .46s cubic-bezier(0.7,0,0.84,0);}
  .swl-stage.dissolving .swl-dust{opacity:1;transition:opacity .32s cubic-bezier(0.16,1,0.3,1);}
  /* status line — sits tight under the title because it belongs to it (§5 proximity) */
  /* §5's eyebrow grey (#8c837a) is specified for white grounds; this one sits on the plate,
     where the cloud runs saturated, so it takes the darker ink-soft token to hold contrast */
  .swl-soon{position:relative;font-family:var(--sans);font-weight:700;text-transform:uppercase;
    font-size:clamp(10px,.95vw,12px);letter-spacing:.18em;color:var(--ink-soft);
    margin:clamp(14px,2vh,24px) 0 0;}

  /* ===========================================================================
     ACT 2 — the three layers, as one ledger
     They used to be a 2-col row followed by two centred stacks, so nothing lined
     up and there was no rule saying which was which. Now every layer is the same
     entry — rule, name on one rail, specimen on the other — and the rails alternate.
     Nothing numbers or captions them: the hairlines carry the structure on their own.
     The artworks are never cropped: each is a finished composition
     (a framed HUD, a contact sheet), so they are sized by shared HEIGHT and keep
     their own widths, which is what gives the column its rhythm.
     =========================================================================== */
  .swl-layers{background:#fff;padding:clamp(72px,11vh,140px) clamp(24px,6vw,72px) clamp(96px,14vh,170px);}
  .swl-layers-in{max-width:1180px;margin:0 auto;}

  .swl-layer{display:grid;grid-template-columns:1fr 1fr;align-items:center;
    gap:clamp(24px,5vw,72px);
    padding:clamp(36px,6vh,64px) 0;border-top:1px solid var(--hair);}
  .swl-layer:last-of-type{border-bottom:1px solid var(--hair);}
  .swl-layer--flip .swl-layer-txt{order:2;}

  .swl-name{font-family:var(--serif);font-weight:700;color:#0b0a09;margin:0;
    font-size:clamp(30px,4.4vw,62px);line-height:1.06;letter-spacing:-.014em;text-wrap:balance;}

  /* The specimen lags the scroll by +/-13px. Locomotive writes --progress on the FIGURE
     (which carries no transform of its own, so its metrics stay honest) and the drift is
     a plain CSS transform on the photo — §5.5, transform only, de-duped and parked
     off-screen by Locomotive. No crop window here: these plates must stay whole. */
  .swl-fig{margin:0;display:flex;justify-content:center;}
  .swl-fig img{display:block;width:auto;max-width:100%;height:auto;
    max-height:var(--fh,clamp(260px,42vh,470px));
    border-radius:clamp(16px,2.4vw,36px);corner-shape:squircle;
    transform:translate3d(0,calc((var(--progress,.5) - .5) * -26px),0);}
  .swl-fig--tall{--fh:clamp(340px,56vh,600px);}

  @media(max-width:760px){
    .swl-layer{grid-template-columns:1fr;gap:clamp(22px,4vh,34px);
      padding:clamp(32px,5vh,48px) 0;}
    .swl-layer--flip .swl-layer-txt{order:0;}       /* one rail on mobile: name always leads */
    .swl-name{font-size:clamp(30px,8.4vw,44px);}
    .swl-fig{--fh:clamp(240px,38vh,380px);}
    .swl-fig--tall{--fh:clamp(320px,48vh,460px);}
  }

  @media (prefers-reduced-motion:reduce){
    .reveal{transition:none;opacity:1;transform:none;}
    html{scroll-behavior:auto;}
    .swl-sheet,.swl-cap,.swl-fig img{transform:none;}
  }
</style>
</head>
<body>

  <section class="swl" data-scroll data-scroll-css-progress>
    <div class="swl-sheet">
      <picture>
        <source type="image/webp" srcset="assets/city/swl-plate-960.webp 960w, assets/city/swl-plate-1440.webp 1440w, assets/city/swl-plate-1920.webp 1920w, assets/city/swl-plate.webp 2080w" sizes="100vw">
        <img src="assets/city/swl-plate.webp" alt="" width="2080" height="3024" fetchpriority="high" decoding="async">
      </picture>
      <div class="swl-grain" aria-hidden="true"></div>
    </div>

    <nav class="nav">
      <a class="brand" href="index.html">FRISS<span class="o">O</span>N</a>
      <div class="links">
        <a href="soulful-living-network">{{nav.cities}}</a>
        <a href="sona.html">{{nav.sona}}</a>
        <a href="founding-catalysts">{{nav.advocater}}</a>
        <a href="sensory-lab" class="cur">{{nav.lab}}</a>
        <a href="field-notes">{{nav.stories}}</a>
      </div>
      <button class="menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false"><span></span><span></span></button>
      <div class="menu" id="menu">
        <a href="soulful-living-network">{{nav.cities}}</a>
        <a href="sona.html">{{nav.sona}}</a>
        <a href="founding-catalysts">{{nav.advocater}}</a>
        <a href="sensory-lab">{{nav.lab}}</a>
        <a href="field-notes">{{nav.stories}}</a>
      </div>
      <!--LANGNAV-->
    </nav>

    <div class="swl-cap">
      <div class="swl-stage" id="swlStage">
        <h1 class="swl-title" id="swlTitle">Sensory<br>World<br>Lab</h1>
        <canvas class="swl-dust" id="swlDust" aria-hidden="true"></canvas>
        <p class="swl-soon">Launching Soon</p>
      </div>
    </div>
  </section>


  <section class="swl-layers">
    <div class="swl-layers-in">
      <article class="swl-layer reveal" data-scroll data-scroll-class="in">
        <div class="swl-layer-txt">
          <h2 class="swl-name">Human Layer</h2>
        </div>
        <figure class="swl-fig" data-scroll data-scroll-css-progress>
          <img src="assets/city/layer-human.webp?v=2" alt="" width="640" height="640" loading="lazy" decoding="async">
        </figure>
      </article>

      <article class="swl-layer swl-layer--flip reveal" data-scroll data-scroll-class="in">
        <div class="swl-layer-txt">
          <h2 class="swl-name">Outlier Layer</h2>
        </div>
        <figure class="swl-fig" data-scroll data-scroll-css-progress>
          <img src="assets/city/layer-outlier.webp" alt="" width="573" height="528" loading="lazy" decoding="async">
        </figure>
      </article>

      <article class="swl-layer reveal" data-scroll data-scroll-class="in">
        <div class="swl-layer-txt">
          <h2 class="swl-name">Adaptive Layer</h2>
        </div>
        <figure class="swl-fig swl-fig--tall" data-scroll data-scroll-css-progress>
          <img src="assets/city/layer-adaptive.webp" alt="" width="720" height="1280" loading="lazy" decoding="async">
        </figure>
      </article>
    </div>
  </section>

  <script>
  var REDUCE = matchMedia('(prefers-reduced-motion:reduce)').matches;

  /* the bar is fixed — firm it up once the artwork has scrolled past */
  (function(){
    var nav=document.querySelector('.nav'), hero=document.querySelector('.swl');
    if(!nav||!hero) return;
    function upd(){ nav.classList.toggle('scrolled', scrollY > hero.offsetHeight - 90); }
    addEventListener('scroll',upd,{passive:true}); addEventListener('resize',upd); upd();
  })();

  /* hover -> the words break into fine pink dust and drift away; leaving pulls them home.
     §5.5: one canvas, rAF only while particles move, reduced-motion opts out entirely. */
  (function(){
    var stage=document.getElementById('swlStage'), title=document.getElementById('swlTitle'), cv=document.getElementById('swlDust');
    if(!stage||!title||!cv) return;
    if(REDUCE) return;
    var ctx=cv.getContext('2d'), DPR=Math.min(devicePixelRatio||1,2);
    var P=[], W=0,H=0, PAD=0, DRIFT=90, raf=0, mode='idle', t0=0, built=false, wipe=0;
    var TINTS=['#e82f63','#ff5c86','#d4174a','#ff8fb0','#c2143f'];

    /* Rasterise the title by asking the DOM where each of its glyphs actually sits.
       Re-typesetting the words into a scaled offscreen canvas — what this did before —
       cannot line up with the rendered text, for three independent reasons:
         · the scaled font-size lands on a different instance of Fraunces' 9..144 opsz
           axis than the DOM uses, so the glyph widths differ;
         · letter-spacing is a computed PX value, so copying it onto a canvas drawn at
           0.54x applied roughly double the tracking it should have;
         · the line breaks were hard-coded to three lines, so any viewport that set the
           text differently drew dust for a layout that wasn't on screen.
       Per-character Range rects remove all three at once: every position, break and
       tracking decision comes from the same layout the user is looking at. */
    function build(){
      var tr=title.getBoundingClientRect(), sr=stage.getBoundingClientRect();
      if(!tr.width||!tr.height) return false;
      var cs=getComputedStyle(title);

      /* pad the canvas so drifting dust fades out in open air instead of being
         clipped at a hard rectangle edge; DRIFT is then sized to land inside it */
      PAD=Math.round(Math.min(200,Math.max(70,tr.height*0.36)));
      DRIFT=PAD*0.55;
      W=Math.ceil(tr.width)+PAD*2; H=Math.ceil(tr.height)+PAD*2;
      cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
      cv.style.width=W+'px'; cv.style.height=H+'px';
      cv.style.left=(tr.left-sr.left-PAD)+'px';
      cv.style.top =(tr.top -sr.top -PAD)+'px';
      ctx.setTransform(DPR,0,0,DPR,0,0);

      var ow=Math.ceil(tr.width), oh=Math.ceil(tr.height);
      var oc=document.createElement('canvas'); oc.width=ow; oc.height=oh;
      var o=oc.getContext('2d',{willReadFrequently:true});
      /* identical family, weight and PX size as the DOM -> identical opsz instance + metrics */
      o.font=cs.fontStyle+' '+cs.fontWeight+' '+cs.fontSize+' '+cs.fontFamily;
      o.fillStyle='#000'; o.textAlign='left'; o.textBaseline='alphabetic';
      try{ o.letterSpacing='0px'; }catch(e){}   /* every x comes from the DOM, not from canvas advances */

      var fm=o.measureText('Hxg');
      var asc=fm.fontBoundingBoxAscent, desc=fm.fontBoundingBoxDescent;
      if(!(asc>0)){ asc=parseFloat(cs.fontSize)*0.8; desc=parseFloat(cs.fontSize)*0.2; }

      var rng=document.createRange(), drew=0;
      var walk=document.createTreeWalker(title,NodeFilter.SHOW_TEXT,null), node;
      while(node=walk.nextNode()){
        var s=node.nodeValue;
        for(var i=0;i<s.length;i++){
          var ch=s.charAt(i);
          if(ch===' '||ch==='\n'||ch==='\t'||ch==='\r') continue;
          try{ rng.setStart(node,i); rng.setEnd(node,i+1); }catch(e){ continue; }
          var r=rng.getBoundingClientRect();
          if(!r.width||!r.height) continue;
          /* CSS parks half the leading above the content box; recover the baseline from
             the rect whether it came back as the content area or the whole line box */
          var base=(r.top-tr.top)+(r.height-(asc+desc))/2+asc;
          o.fillText(ch, r.left-tr.left, base);
          drew++;
        }
      }
      if(!drew) return false;

      var d; try{ d=o.getImageData(0,0,ow,oh).data; }catch(e){ return false; }
      P.length=0;
      var step=Math.max(1,Math.round(ow/300)), cx=ow/2, cy=oh/2;
      for(var y=0;y<oh;y+=step)for(var x=0;x<ow;x+=step){
        if(d[(y*ow+x)*4+3]<110) continue;
        var ang=Math.atan2(y-cy,x-cx)+(Math.random()-.5)*1.1, sp=.5+Math.random()*1.9;
        P.push({hx:x+PAD,hy:y+PAD,x:x+PAD,y:y+PAD,
                vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-.35,
                s:Math.max(.9,step*(.46+Math.random()*.44)), a:1, d:Math.random()*.5,
                life:1.5+Math.random()*1.4, c:TINTS[(x+y)%TINTS.length]});
      }
      built=P.length>0; return built;
    }

    function tick(ts){
      if(!t0) t0=ts;
      var el=(ts-t0)/1000, alive=false;
      ctx.clearRect(0,0,W,H);
      for(var i=0;i<P.length;i++){
        var p=P[i];
        if(mode==='out'){
          var lt=(el-p.d)/p.life; if(lt<0)lt=0; if(lt<1)alive=true; else lt=1;
          /* displacement and fade share one curve: a mote thins out in step with how far
             it has been thrown, instead of the old linear 1-lt ramp that emptied the word
             at a constant rate no matter what the motion was doing */
          var e=lt*lt;
          p.x=p.hx+p.vx*e*DRIFT; p.y=p.hy+p.vy*e*DRIFT; p.a=1-e;
        }else{
          p.x+=(p.hx-p.x)*.075; p.y+=(p.hy-p.y)*.075; p.a+=(1-p.a)*.07;
          if(Math.abs(p.x-p.hx)+Math.abs(p.y-p.hy)>.5||p.a<.97) alive=true;
        }
        if(p.a>.012){ ctx.globalAlpha=p.a; ctx.fillStyle=p.c; ctx.fillRect(p.x,p.y,p.s,p.s); }
      }
      ctx.globalAlpha=1;
      if(alive){ raf=requestAnimationFrame(tick); return; }
      /* the reassembled word is still painted here; clearing it now would cut the fade
         short, so hold the last frame and wipe once the CSS transition has run out */
      if(mode==='back'){ stage.classList.remove('dissolving');
        clearTimeout(wipe); wipe=setTimeout(function(){ ctx.clearRect(0,0,W,H); },520); }
      mode='idle'; raf=0;
    }
    function start(m){ if(mode===m) return; mode=m; t0=0; cancelAnimationFrame(raf); raf=requestAnimationFrame(tick); }
    function out(){ if(!built && !build()) return; clearTimeout(wipe); stage.classList.add('dissolving');
      for(var i=0;i<P.length;i++){ var p=P[i]; p.x=p.hx; p.y=p.hy; p.a=1; } start('out'); }
    function back(){ if(!built) return; start('back'); }

    if(matchMedia('(hover:hover)').matches){
      title.addEventListener('mouseenter',out);
      stage.addEventListener('mouseleave',back);
    }else{
      title.addEventListener('click',function(){ mode==='out'?back():out(); });
    }
    /* the canvas is measured against live rects, so any relayout invalidates it */
    addEventListener('resize',function(){ built=false;
      if(mode!=='idle'){ cancelAnimationFrame(raf); mode='idle'; raf=0; stage.classList.remove('dissolving'); ctx.clearRect(0,0,W,H); } });
    if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){ built=false; });
    window.__swlRebuild=function(){ built=false; return build(); };
  })();

  (function(){ var b=document.getElementById('menuBtn'), m=document.getElementById('menu'); if(!b||!m) return;
    b.addEventListener('click',function(){ var o=m.classList.toggle('open'); b.classList.toggle('open',o); b.setAttribute('aria-expanded',o?'true':'false'); });
    m.addEventListener('click',function(){ m.classList.remove('open'); b.classList.remove('open'); b.setAttribute('aria-expanded','false'); });
  })();

  /* Locomotive Scroll v5 (MIT) — lerped native scroll, and its own in-view engine drives
     the reveals: every [data-scroll][data-scroll-class="in"] gets `.in` once, which is what
     the .reveal transition already keys off. Without data-scroll-repeat the class is never
     removed, so nothing re-animates on the way back up. The plate and the specimens carry
     data-scroll-css-progress and their drift is pure CSS. Lenis leaves touch scrolling native. */
  (function(){
    function revealAll(){ document.querySelectorAll('.reveal').forEach(function(el){ el.classList.add('in'); }); }
    function boot(){
      if(REDUCE || !window.LocomotiveScroll){ revealAll(); return; }
      try{
        window.__loco = new LocomotiveScroll({
          lenisOptions:{
            duration:1.05,
            /* expo-out: a real A->B move, so it gets an ease (§5.9). No overshoot. */
            easing:function(t){ return t===1?1:1-Math.pow(2,-9*t); },
            smoothWheel:true, wheelMultiplier:1, touchMultiplier:1.6, syncTouch:false
          },
          triggerRootMargin:'0px 0px -12% 0px',   /* a block reveals once it is 12% into view */
          rafRootMargin:'120% 0% 120% 0%'         /* progress rAF parks well before/after screen */
        });
      }catch(e){ revealAll(); }
    }
    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
  })();
  </script>
</body>
</html>
