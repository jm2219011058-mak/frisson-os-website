<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Living World Model — FRISSON</title>
<meta name="description" content="Living World Model — Frisson's evolving intelligence of life, space, and human experience.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/type.css">
<style>
  :root{
    --bg:#ffffff;--ink:#2b1d12;--ink-soft:#5b4a3b;--accent:#e07b3c;--hair:rgba(43,29,18,.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;overflow-x:clip;}
  body{overflow-x:clip;background:var(--bg);color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased;}

  /* nav — white, sticky (matches Field Notes) */
  .nav{position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:space-between;
    padding:18px clamp(20px,5vw,64px);background:#fff;border-bottom:1px solid var(--hair);}
  .nav .brand{font-family:"Playfair Display","Noto Serif SC",serif;font-size:clamp(18px,2.4vw,24px);letter-spacing:.14em;color:var(--ink);text-decoration:none;font-weight:500;}
  .nav .brand .o{color:var(--accent);}
  .nav .links{display:flex;gap:clamp(18px,3vw,46px);}
  .nav .links a{font-family:var(--sans);font-size:clamp(12px,1.1vw,15px);letter-spacing:.02em;color:var(--ink);text-decoration:none;transition:color .25s;white-space:nowrap;}
  .nav .links a:hover,.nav .links a.cur{color:var(--accent);}
  .menu-btn{display:none;flex-direction:column;justify-content:center;gap:6px;width:36px;height:36px;background:transparent;border:0;cursor:pointer;padding:0;}
  .menu-btn span{display:block;width:24px;height:2px;background:#2b1d12;border-radius:2px;transition:transform .3s;}
  .menu-btn.open span:nth-child(1){transform:translateY(4px) rotate(45deg);}
  .menu-btn.open span:nth-child(2){transform:translateY(-4px) rotate(-45deg);}
  .menu{display:flex;position:absolute;top:100%;right:clamp(16px,5vw,44px);margin-top:12px;flex-direction:column;gap:10px;z-index:70;
    opacity:0;pointer-events:none;transform:translateY(-10px);
    transition:opacity .25s ease, transform .4s cubic-bezier(.34,1.56,.64,1);}
  .menu.open{opacity:1;pointer-events:auto;transform:none;}
  .menu a{opacity:0;text-decoration:none;}
  .menu.open a{opacity:1;}
  @media(min-width:681px){.menu{display:none;}}
  @media (max-width:680px){ .nav .links{display:none;} .menu-btn{display:flex;} }

  /* mobile menu — full-screen paper sheet, quiet editorial links (house pattern) */
  .menu{position:fixed;inset:0;margin:0;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(22px,5vh,44px);background:rgba(255,255,255,.86);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    z-index:55;transform:none;transition:opacity .32s cubic-bezier(0.25,0.1,0.25,1);}
  .menu.open{transform:none;}
  .menu a{background:transparent;box-shadow:none;border-radius:0;padding:6px 14px;color:#2b1d12;
    font-family:var(--serif);font-weight:400;font-size:clamp(23px,5.8vw,32px);letter-spacing:.012em;line-height:1.18;
    transform:translateY(12px);transition:opacity .4s ease,transform .55s cubic-bezier(0.25,0.1,0.25,1),color .25s;}
  .menu.open a{transform:none;}
  .menu a:hover,.menu a:active{color:var(--accent);}
  .nav.menu-open{background:transparent;border-color:transparent;}
  .nav.menu-open .brand{color:#2b1d12;}
  .nav.menu-open .menu-btn span{background:#2b1d12;}
  .menu-btn.open span{background:#2b1d12;}
  .nav .brand,.nav .menu-btn{position:relative;z-index:60;}

  /* hero — quiet editorial placeholder */
  .lwm-hero{position:relative;overflow:hidden;min-height:calc(100svh - 73px);display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:clamp(72px,11vh,140px) clamp(24px,6vw,40px);}
  /* thermal amoeba — one canvas layer floating ABOVE the type (§5.5: single layer, offscreen pause) */
  .lwm-swim{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;}
  .lwm-eyebrow,.lwm-title,.lwm-sub{position:relative;z-index:1;}
  .lwm-eyebrow{font-family:var(--sans);font-weight:700;font-size:clamp(11px,1.2vw,13px);letter-spacing:.18em;text-transform:uppercase;color:#8c837a;margin:0 0 clamp(18px,2.6vh,28px);}
  .lwm-title{font-family:var(--serif);font-weight:700;text-transform:uppercase;font-size:clamp(64px,13vw,168px);line-height:1.02;letter-spacing:.01em;color:var(--ink);margin:0 0 clamp(20px,3.4vh,34px);}
  .lwm-sub{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(15px,1.7vw,19px);line-height:1.6;color:#57503f;margin:0;}

  /* footer — light (matches Founding Catalysts) */
  .lwm-foot{border-top:1px solid rgba(43,29,18,.08);text-align:center;
    padding:clamp(48px,8vh,96px) clamp(24px,6vw,40px) clamp(40px,6vh,72px);
    font-family:var(--sans);font-size:13px;letter-spacing:.02em;color:var(--ink-soft);}
  .lwm-foot a{color:var(--ink);text-decoration:none;margin:0 10px;}
  .lwm-foot a:hover{color:var(--accent);}
</style>
</head>
<body>

  <nav class="nav">
    <a class="brand" href="index.html">FRISS<span class="o">O</span>N</a>
    <div class="links">
      <a href="soulful-living-network">{{nav.cities}}</a>
      <a href="sona.html">{{nav.sona}}</a>
      <a href="founding-catalysts">{{nav.advocater}}</a>
      <a href="sensory-lab">{{nav.lab}}</a>
      <a href="field-notes">{{nav.stories}}</a>
    </div>
    <button class="menu-btn" id="menuBtn" aria-label="Menu"><span></span><span></span></button>
    <div class="menu" id="menu">
      <a href="soulful-living-network">{{nav.cities}}</a>
      <a href="sona.html">{{nav.sona}}</a>
      <a href="founding-catalysts">{{nav.advocater}}</a>
      <a href="sensory-lab">{{nav.lab}}</a>
      <a href="field-notes">{{nav.stories}}</a>
    </div>
    <!--LANGNAV-->
  </nav>

  <main>
    <section class="lwm-hero" id="lwmHero">
      <canvas class="lwm-swim" id="lwmSwim" aria-hidden="true"></canvas>
      <p class="lwm-eyebrow">Living World Model</p>
      <h1 class="lwm-title">SPACE<br>IS<br>ALIVE</h1>
      <p class="lwm-sub">Launching Soon ...</p>
    </section>
  </main>

  <footer class="lwm-foot"><a href="index.html">FRISSON</a> · <a href="terms.html">Terms of Use</a> · <a href="privacy.html">Privacy Policy</a></footer>

  <script>
    (function(){ var b=document.getElementById('menuBtn'), m=document.getElementById('menu'), n=document.querySelector('.nav'); if(!b||!m) return;
      b.addEventListener('click',function(){ var o=m.classList.toggle('open'); b.classList.toggle('open',o); if(n)n.classList.toggle('menu-open',o); });
      m.addEventListener('click',function(){ m.classList.remove('open'); b.classList.remove('open'); if(n)n.classList.remove('menu-open'); });
    })();

    /* thermal amoeba — a heat-map metaball cluster drifting over the headline.
       The field is computed on a tiny offscreen buffer (~150px wide) and scaled up,
       so the per-pixel palette mapping stays cheap. §5.5 discipline: one canvas,
       rAF stops when the hero is offscreen or the tab hidden; reduced-motion = one frame. */
    (function(){
      var cv=document.getElementById('lwmSwim'), hero=document.getElementById('lwmHero');
      if(!cv||!hero) return;
      var ctx=cv.getContext('2d'), W=0,H=0;
      var off=document.createElement('canvas'), octx=off.getContext('2d'), OW=0,OH=0, img=null;
      function size(){
        W=hero.clientWidth; H=hero.clientHeight;
        cv.width=W; cv.height=H;
        OW=Math.max(96,Math.round(W/9)); OH=Math.max(72,Math.round(H/9));
        off.width=OW; off.height=OH; img=octx.createImageData(OW,OH);
        ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
      }
      size(); addEventListener('resize',size);

      /* thermal palette LUT: transparent → pink rim → yellow → red/orange → green → cyan/blue core */
      var STOPS=[
        [0.00,[255,255,255,0]],
        [0.16,[255,150,215,120]],
        [0.24,[255,238,160,235]],
        [0.34,[240,90,50,255]],
        [0.46,[60,175,70,255]],
        [0.60,[95,200,255,255]],
        [0.80,[40,140,235,255]],
        [1.00,[30,190,120,255]]
      ];
      var LUT=new Uint8ClampedArray(256*4);
      for(var i=0;i<256;i++){
        var t=i/255, a=STOPS[0], b=STOPS[STOPS.length-1];
        for(var s=0;s<STOPS.length-1;s++){ if(t>=STOPS[s][0]&&t<=STOPS[s+1][0]){ a=STOPS[s]; b=STOPS[s+1]; break; } }
        var f=(t-a[0])/((b[0]-a[0])||1);
        for(var c=0;c<4;c++) LUT[i*4+c]=a[1][c]+(b[1][c]-a[1][c])*f;
      }

      function rnd(a,b){ return a+Math.random()*(b-a); }
      /* one cluster of metaballs that wanders as a group */
      var balls=[]; var NB=11;
      for(i=0;i<NB;i++){
        balls.push({ ox:rnd(-.20,.20), oy:rnd(-.15,.15), r:rnd(.05,.12),
                     w1:rnd(.2,.6), w2:rnd(.2,.6), p1:rnd(0,7), p2:rnd(0,7) });
      }
      var C={x:.62,y:.3};                                    /* cluster centre (fraction of hero) */
      var last=0, running=false, raf=0;
      function frame(ts){
        if(!running) return;
        var t=ts/1000; last=ts;
        /* the whole creature glides in a slow lissajous around the upper title area */
        C.x=.5+.24*Math.sin(t*.11+1.7); C.y=.34+.16*Math.sin(t*.083);
        var d=img.data, minWH=Math.min(OW,OH);
        var bx=[],by=[],br=[];
        for(var b=0;b<NB;b++){
          var B=balls[b];
          bx[b]=(C.x+B.ox+.05*Math.sin(t*B.w1+B.p1))*OW;
          by[b]=(C.y+B.oy+.05*Math.sin(t*B.w2+B.p2))*OH;
          br[b]=B.r*minWH*(1.45+.28*Math.sin(t*.21+b));
        }
        var k=0;
        for(var y=0;y<OH;y++){
          for(var x=0;x<OW;x++){
            var f=0;
            for(b=0;b<NB;b++){
              var dx=x-bx[b], dy=(y-by[b])*1.15, rr=br[b];
              f+=rr*rr/(dx*dx+dy*dy+1);
            }
            var v=(f*.16-.30)*2.4; if(v<0)v=0; if(v>1)v=1;
            if(v>0){
              var band=.30*Math.sin(y*.62+t*.9)+.16*Math.sin((x+y)*.30-t*.6)+.12*Math.sin(x*.45+t*.45);
              v+=band*v*(1-v)*4*.55; if(v<.02)v=.02; if(v>1)v=1;
            }
            var li=(v*255)|0; li*=4;
            d[k]=LUT[li]; d[k+1]=LUT[li+1]; d[k+2]=LUT[li+2]; d[k+3]=LUT[li+3];
            k+=4;
          }
        }
        octx.putImageData(img,0,0);
        ctx.clearRect(0,0,W,H);
        ctx.drawImage(off,0,0,W,H);
        raf=requestAnimationFrame(frame);
      }
      function start(){ if(running) return; running=true; last=performance.now(); raf=requestAnimationFrame(frame); }
      function stop(){ running=false; cancelAnimationFrame(raf); }
      function frameOnce(){ running=true; frame(performance.now()); running=false; cancelAnimationFrame(raf); }
      if(matchMedia('(prefers-reduced-motion:reduce)').matches){ frameOnce(); return; }
      var io=new IntersectionObserver(function(es){ es[0].isIntersecting?start():stop(); });
      io.observe(hero);
      document.addEventListener('visibilitychange',function(){ document.hidden?stop():start(); });
    })();
  </script>
</body>
</html>
