# Netlify config — multilingual static build.
# The build machine turns src/ templates + the translation table into
# EN (root) and ZH (/zh/) pages, output to /dist which Netlify publishes.
[build]
  command = "node gen-i18n.mjs && node build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Serverless functions (Frisson Fellow wall: /api/fellows, backed by Netlify Blobs)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Pretty URL: Field Notes lives at /field-notes (address bar), served from stories.html.
# Old /stories links 301 to the new path.
[[redirects]]
  from = "/field-notes"
  to = "/stories.html"
  status = 200

[[redirects]]
  from = "/stories"
  to = "/field-notes"
  status = 301
  force = true

[[redirects]]
  from = "/stories.html"
  to = "/field-notes"
  status = 301
  force = true

[[redirects]]
  from = "/zh/field-notes"
  to = "/zh/stories.html"
  status = 200

[[redirects]]
  from = "/zh/stories"
  to = "/zh/field-notes"
  status = 301
  force = true

[[redirects]]
  from = "/zh/stories.html"
  to = "/zh/field-notes"
  status = 301
  force = true

# Pretty URL: Founding Catalysts lives at /founding-catalysts, served from advocater.html.
[[redirects]]
  from = "/founding-catalysts"
  to = "/advocater.html"
  status = 200

[[redirects]]
  from = "/advocater"
  to = "/founding-catalysts"
  status = 301
  force = true

[[redirects]]
  from = "/advocater.html"
  to = "/founding-catalysts"
  status = 301
  force = true

[[redirects]]
  from = "/zh/founding-catalysts"
  to = "/zh/advocater.html"
  status = 200

[[redirects]]
  from = "/zh/advocater"
  to = "/zh/founding-catalysts"
  status = 301
  force = true

[[redirects]]
  from = "/zh/advocater.html"
  to = "/zh/founding-catalysts"
  status = 301
  force = true

# Assets: cache 30 days (updates ride a ?v= bump); revalidate after expiry so same-filename changes still propagate.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, must-revalidate"

# Third-party libraries never change at the same path → cache a full year, immutable.
[[headers]]
  for = "/assets/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Baseline security headers (help scanners/clients trust the site)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
