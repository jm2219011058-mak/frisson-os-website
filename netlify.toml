# Netlify config — multilingual static build.
# The build machine turns src/ templates + the translation table into
# EN (root) and ZH (/zh/) pages, output to /dist which Netlify publishes.
[build]
  command = "node gen-i18n.mjs && node build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Serverless functions (Frisson Fellow wall: /api/fellows, backed by Netlify Blobs)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Pretty URL: Field Notes lives at /field-notes (address bar), served from stories.html.
# Old /stories links 301 to the new path.
[[redirects]]
  from = "/field-notes"
  to = "/stories.html"
  status = 200

[[redirects]]
  from = "/stories"
  to = "/field-notes"
  status = 301
  force = true

[[redirects]]
  from = "/stories.html"
  to = "/field-notes"
  status = 301
  force = true

[[redirects]]
  from = "/zh/field-notes"
  to = "/zh/stories.html"
  status = 200

[[redirects]]
  from = "/zh/stories"
  to = "/zh/field-notes"
  status = 301
  force = true

[[redirects]]
  from = "/zh/stories.html"
  to = "/zh/field-notes"
  status = 301
  force = true

