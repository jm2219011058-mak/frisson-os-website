<section class="tier ff-mimo" id="advocater" style="text-align:center;isolation:isolate;">
    <div class="tier-bg"><img src="assets/city/advocater-circle-bg.jpg" alt="" loading="lazy"></div>
    <div class="tier-scrim" style="background:radial-gradient(rgba(235,238,245,.02) 0.5px,transparent 1px) 0 0/7px 7px,radial-gradient(120% 88% at 50% 14%,rgba(58,96,182,.14),rgba(9,13,26,0) 56%),linear-gradient(180deg,rgba(10,13,24,.9),rgba(6,8,16,.94));"></div>
    <div class="ff-pattern" id="ffPat" aria-hidden="true"></div>
    <div class="tier-inner adv-grid">
      <div class="adv-left">
      <div class="tier-intro" id="advIntro">
        <div class="reveal">
          <h2 class="t-title" style="margin:0 auto;max-width:20ch;">Founding Fellow</h2>
        </div>
        <p class="t-label reveal" style="justify-content:center;margin-top:clamp(40px,6vh,60px);color:var(--accent);letter-spacing:.28em;">If you are</p>
        <div class="roles6 reveal">
          <p class="r">The Explorer</p>
          <p class="r">The Creator</p>
          <p class="r">The Visionary</p>
          <p class="r">The Collector</p>
          <p class="r">The Dreamer</p>
          <p class="r">The Pioneer</p>
          <p class="r">…</p>
        </div>
        <p class="t-copy reveal" style="margin-left:auto;margin-right:auto;font-style:italic;max-width:40ch;">Seek wonder. Need Vision Not Money.<br>Join the Founding Fellow.</p>
        <button type="button" class="apply reveal" data-open="adv">Enquire <span class="arw">&rsaquo;</span></button>
      </div>
      <div class="tier-apply" id="advApply" hidden>
        <button type="button" class="back-btn" data-back="adv">&lsaquo; Back</button>
        <p class="t-copy" style="margin:0 auto clamp(20px,3.5vh,28px);">Space is alive, I am loving it.</p>
        <form name="advocater-circle" method="POST" data-netlify="true" netlify-honeypot="bot-field" class="nf-form center" id="advocaterForm">
          <input type="hidden" name="form-name" value="advocater-circle">
          <p hidden><label>Don't fill this out: <input name="bot-field"></label></p>
          <div class="f-row">
            <div class="field"><label class="lbl" for="a-name">Full name</label><input id="a-name" type="text" name="name" placeholder="Your name" required></div>
            <div class="field"><label class="lbl" for="a-email">Email</label><input id="a-email" type="email" name="email" placeholder="you@email.com" required></div>
          </div>
          <div class="field"><label class="lbl" for="a-title">Title On Billboard</label><input id="a-title" type="text" name="title" placeholder="Founder, Investor, Artist…" required></div>
          <div class="field"><label class="lbl" for="a-link">Link you want to share <span style="text-transform:none;letter-spacing:0;opacity:.7;">(optional)</span></label><input id="a-link" type="text" name="link" placeholder="LinkedIn, company link, project link…"></div>
          <label class="consent"><input type="checkbox" name="consent" value="yes"> I agree to be contacted by Frisson about the Advocater Program.</label>
          <button type="submit" class="apply">Apply to the Founding Circle <span class="arw">&rsaquo;</span></button>
          <p class="legal">By submitting, you agree to our <a href="terms.html">Terms of Use</a> and <a href="privacy.html">Privacy Policy</a>.</p>
        </form>
      </div>
      </div><!-- /adv-left -->
      <aside class="adv-dash" id="ffDash" aria-label="Frisson Fellow Dashboard">
        <div class="ff-bgtext" id="ffBg" aria-hidden="true"></div>
        <div class="ff-glow" id="ffGlow" aria-hidden="true"></div>
        <div class="ff-slot" id="ffSlot">
          <div class="ff-marquee" id="ffMarquee"></div>
        </div>
        <div class="ff-mint" id="ffMint" aria-live="polite"></div>
        <canvas class="ff-cvs" id="ffCvs" aria-hidden="true"></canvas>
      </aside>
    </div>
    <div class="ff-invert" id="ffInvert" aria-hidden="true"></div>
  </section>
