<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thermal type — SPACE IS ALIVE</title>
<!--
  热成像文字组件（独立 demo，未挂载到任何页面）
  ─────────────────────────────────────────────
  原理：单四边形 WebGL fragment shader，热跟着文字描线走。
    字形蒙版 m：DOM 文字按同字体/同位置烘焙进离屏 canvas，降采样-升采样两级模糊
                （宽晕 + 贴描线），一次烘焙成纹理，字形是温度场的「燃料」。
    标量场 v = m(域扭曲采样) × (基底+fbm噪声) × 高斯热核(热源) × 热度 - 阈值
    → alpha = smoothstep(v)（场低处透明，露出下层 DOM 文字；字母 counter 自然留白洞）
    → 颜色 = 调色带 pal(v)（白→米黄→黄→粉→红→橙→绿→蓝，分段 smoothstep 出色带）
  热源：无指针时自主游走（多正弦叠加，相位线性 §5.9）；指针进入后跟随指针。

  性能（遵守 §5.5）：
    - 不用 SVG feTurbulence（红线）；噪声在 GPU 上算，canvas 独立成层。
    - 低分辨率渲染（0.4 × dpr）再放大——热成像本来就该糊，还省 6 倍像素。
    - IntersectionObserver 离屏停 rAF；prefers-reduced-motion 只画一帧静止。
  字体：demo 用 Space Mono 占位（参考稿是圆角 mono）；挂进正式页面时再定字体角色。
-->
<style>
  html,body{margin:0;background:#fff;}
  .tt-stage{
    position:relative;
    min-height:100svh;
    display:grid; place-items:center;
    overflow:clip;
    cursor:crosshair;
  }
  .tt-word{
    position:relative; z-index:1;
    margin:0;
    font-family:"Space Mono", ui-monospace, "SF Mono", Menlo, monospace;
    font-weight:400;
    font-size:clamp(56px, 12vw, 168px);
    line-height:1.08;
    letter-spacing:.04em;
    text-align:center;
    color:#454545;
    user-select:none;
  }
  .tt-fx{
    position:absolute; inset:0; z-index:2;
    width:100%; height:100%;
    pointer-events:none;
  }
  .tt-cap{
    position:absolute; z-index:3; left:50%; bottom:22px; transform:translateX(-50%);
    font-family:"Space Mono", ui-monospace, Menlo, monospace;
    font-size:11px; letter-spacing:.18em; color:#b7b0a8;
  }
  @media (hover:none){ .tt-cap{display:none} }
</style>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">
</head>
<body>

<section class="tt-stage" id="ttStage">
  <h1 class="tt-word">SPACE<br>IS<br>ALIVE</h1>
  <canvas class="tt-fx" id="ttFx" aria-hidden="true"></canvas>
  <p class="tt-cap">MOVE — HEAT FOLLOWS</p>
</section>

<script>
(function(){
  'use strict';
  var stage = document.getElementById('ttStage');
  var cv = document.getElementById('ttFx');
  var gl = cv.getContext('webgl', {alpha:true, antialias:false, premultipliedAlpha:true, depth:false, stencil:false});
  if(!gl) return; // 无 WebGL：静态文字兜底

  var VERT = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
  var FRAG = [
    'precision mediump float;',
    'uniform vec2 u_res;',
    'uniform float u_t;',
    'uniform vec2 u_hot;',
    'uniform float u_amp;',
    'uniform sampler2D u_txt;',
    'float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}',
    'float vnoise(vec2 p){',
    '  vec2 i=floor(p),f=fract(p);',
    '  vec2 u=f*f*(3.0-2.0*f);',
    '  return mix(mix(hash(i),hash(i+vec2(1.,0.)),u.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x),u.y);',
    '}',
    'float fbm(vec2 p){',
    '  float v=0.0,a=0.5;',
    '  for(int i=0;i<4;i++){v+=a*vnoise(p);p=p*2.03+vec2(19.7,7.3);a*=0.5;}',
    '  return v;',
    '}',
    // 热成像调色带：色带边界靠窄 smoothstep，故意留出「台阶」感
    'vec3 pal(float h){',
    '  vec3 c=vec3(1.0);',                                      // 白边（白底上隐形，blob 像从纸里洇出来）
    '  c=mix(c,vec3(1.00,0.97,0.68),smoothstep(0.03,0.08,h));', // 米黄
    '  c=mix(c,vec3(1.00,0.90,0.30),smoothstep(0.15,0.21,h));', // 黄
    '  c=mix(c,vec3(0.97,0.50,0.77),smoothstep(0.36,0.42,h));', // 粉
    '  c=mix(c,vec3(0.89,0.13,0.18),smoothstep(0.48,0.53,h));', // 红
    '  c=mix(c,vec3(0.82,0.44,0.10),smoothstep(0.58,0.63,h));', // 焦橙
    '  c=mix(c,vec3(0.24,0.62,0.34),smoothstep(0.67,0.72,h));', // 绿
    '  c=mix(c,vec3(0.44,0.70,0.92),smoothstep(0.77,0.84,h));', // 蓝芯
    '  return c;',
    '}',
    'void main(){',
    '  float mn=min(u_res.x,u_res.y);',
    '  vec2 p=(gl_FragCoord.xy-0.5*u_res)/mn;',
    '  float t=u_t;',
    '  vec2 q=p*2.2;',
    '  float w1=fbm(q+vec2(0.0,t*0.055));',        // 域扭曲：让边缘长出「伪足」
    '  float w2=fbm(q+vec2(4.7,-t*0.045));',
    '  vec2 wp=q+2.1*vec2(w1-0.47,w2-0.47);',
    '  float n=fbm(wp+vec2(t*0.03,t*0.02));',
    '  vec2 uv=gl_FragCoord.xy/u_res;',
    '  vec2 wuv=uv+(0.07*vec2(w1-0.47,w2-0.47)*mn)/u_res;', // 扭曲采样：热溢出描线的毛边
    '  float m=pow(texture2D(u_txt,wuv).r,0.6);',  // gamma 提亮蒙版裙摆：团块能鼓出描线外
    '  vec2 dv=p-u_hot;',
    '  float env=max(exp(-(dv.x*dv.x*5.0+dv.y*dv.y*9.0)),0.36);', // 椭圆热核（横向略宽，热沿词延展）
    '  float v=m*(0.35+0.66*n)*env*u_amp-0.27;',
    '  float a=smoothstep(0.0,0.04,v);',
    '  float h=clamp(v*1.25,0.0,1.0);',
    '  h+=0.07*(vnoise(wp*5.0+vec2(t*0.1,0.))-0.5);', // 细颗粒扰动，色带边缘出锯齿状斑驳
    '  vec3 c=pal(h);',
    '  gl_FragColor=vec4(c*a,a);',                 // premultiplied alpha
    '}'
  ].join('\n');

  function sh(type, src){
    var s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  var prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog);
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, 'a');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  var uRes = gl.getUniformLocation(prog, 'u_res');
  var uT   = gl.getUniformLocation(prog, 'u_t');
  var uHot = gl.getUniformLocation(prog, 'u_hot');
  var uAmp = gl.getUniformLocation(prog, 'u_amp');
  var uTxt = gl.getUniformLocation(prog, 'u_txt');

  // ── 字形蒙版纹理（描线 = 温度场的燃料）────────────────────
  var tex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);   // canvas y 朝下 → GL y 朝上
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.uniform1i(uTxt, 0);

  var word = document.querySelector('.tt-word');

  // 连续对半降采样 steps 次再放大回来 ≈ 半径 2^steps px 的模糊（跨浏览器，不依赖 ctx.filter）
  function shrink(src, steps){
    var s = src;
    for(var i = 0; i < steps; i++){
      var nw = Math.max(1, Math.round(s.width / 2)), nh = Math.max(1, Math.round(s.height / 2));
      var d = document.createElement('canvas'); d.width = nw; d.height = nh;
      d.getContext('2d').drawImage(s, 0, 0, nw, nh);
      s = d;
    }
    return s;
  }

  // 一次性烘焙：DOM 文字按同字体/同位置画进离屏 canvas，宽晕 + 贴描线两层模糊叠加
  function bakeText(){
    var w = cv.width, h = cv.height;
    if(w < 4 || h < 4) return;
    var stR = stage.getBoundingClientRect();
    var r = word.getBoundingClientRect();
    var cs = getComputedStyle(word);
    var fs = parseFloat(cs.fontSize) * RES;
    var lh = parseFloat(cs.lineHeight) * RES;
    var lines = word.innerText.split('\n').map(function(s){ return s.trim(); }).filter(Boolean);

    var T2 = document.createElement('canvas'); T2.width = w; T2.height = h;
    var c = T2.getContext('2d');
    c.fillStyle = '#000'; c.fillRect(0, 0, w, h);
    c.fillStyle = '#fff';
    c.font = cs.fontWeight + ' ' + fs + 'px ' + cs.fontFamily;
    if('letterSpacing' in c) c.letterSpacing = ((parseFloat(cs.letterSpacing) || 0) * RES) + 'px';
    c.textAlign = 'center'; c.textBaseline = 'alphabetic';
    // 基线按 CSS 行盒算法：内容区(ascent+descent)在行盒里垂直居中，不用 canvas 的 middle（em 框中点，会偏）
    var mt = c.measureText('HXg');
    var asc  = mt.fontBoundingBoxAscent  || fs * 0.8;
    var desc = mt.fontBoundingBoxDescent || fs * 0.2;
    var half = (lh - (asc + desc)) / 2;
    var cx  = (r.left + r.width / 2 - stR.left) * RES;
    var top = (r.top - stR.top) * RES;
    for(var i = 0; i < lines.length; i++) c.fillText(lines[i], cx, top + lh * i + half + asc);

    // 三层叠加：特宽晕(×4)扩出团块的裙摆、宽晕(×2)、贴描线(×1)；lighter 在描线附近饱和成平台
    var M = document.createElement('canvas'); M.width = w; M.height = h;
    var mc = M.getContext('2d');
    mc.fillStyle = '#000'; mc.fillRect(0, 0, w, h);
    mc.globalCompositeOperation = 'lighter';
    var mnp = Math.min(w, h);
    var sBase = Math.max(2, Math.min(7, Math.round(Math.log(mnp * 0.05) / Math.LN2)));
    var xl     = shrink(T2, sBase + 2);
    var wide   = shrink(T2, sBase);
    var narrow = shrink(T2, 2);
    // 叠加次数克制：饱和平台只允许出现在描线正上方，字内空腔/行间要留出灰阶
    var k2;
    mc.globalAlpha = 1;
    for(k2 = 0; k2 < 3; k2++) mc.drawImage(xl, 0, 0, w, h);
    mc.globalAlpha = 0.7; mc.drawImage(wide,   0, 0, w, h);
    mc.globalAlpha = 0.7; mc.drawImage(narrow, 0, 0, w, h);

    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, M);
  }

  gl.clearColor(0,0,0,0);

  // ── 尺寸：低清渲染 + CSS 放大（尺寸没变不写，§5.5）─────────
  var RES = 0.5 * Math.min(window.devicePixelRatio || 1, 2);
  function resize(){
    var r = stage.getBoundingClientRect();
    var w = Math.max(2, Math.round(r.width  * RES));
    var h = Math.max(2, Math.round(r.height * RES));
    if(w === cv.width && h === cv.height) return;
    cv.width = w; cv.height = h;
    gl.viewport(0, 0, w, h);
    bakeText();
  }
  resize();
  window.addEventListener('resize', resize);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(bakeText); // 字体换装后重烘焙

  // ── 热源：自主游走 ↔ 指针跟随 ────────────────────────────
  var T = 0, last = 0, raf = 0, running = false;
  var hx = 0, hy = 0, amp = 0.75;      // 当前值（缓动逼近目标）
  var tx = 0, ty = 0, ta = 0.75;      // 目标值
  var ptr = false;

  stage.addEventListener('pointermove', function(e){
    var r = stage.getBoundingClientRect();
    var mn = Math.min(r.width, r.height);
    tx = (e.clientX - r.left - r.width  / 2) / mn;
    ty = (r.height / 2 - (e.clientY - r.top)) / mn;   // GL 的 y 朝上
    ta = 1.1;
    ptr = true;
  });
  stage.addEventListener('pointerleave', function(){ ptr = false; });

  // 移动端：手指落在词上 → 这次手势归热场（preventDefault 阻止滚动），落在别处照常滚页。
  // 取消默认后部分浏览器停发 pointermove，所以直接用 touch 坐标喂热源（同 sona #s4 的教训）。
  var claim = false;
  function heatFromTouch(t){
    var r = stage.getBoundingClientRect();
    var mn = Math.min(r.width, r.height);
    tx = (t.clientX - r.left - r.width  / 2) / mn;
    ty = (r.height / 2 - (t.clientY - r.top)) / mn;
    ta = 1.1; ptr = true;
  }
  stage.addEventListener('touchstart', function(e){
    var el = e.target;
    claim = !!(el && el.closest && el.closest('.tt-word'));
    if(!claim) return;
    e.preventDefault();
    heatFromTouch(e.touches[0]);
  }, {passive:false});
  stage.addEventListener('touchmove', function(e){
    if(!claim) return;
    e.preventDefault();
    heatFromTouch(e.touches[0]);
  }, {passive:false});
  function endT(){ if(claim){ claim = false; ptr = false; } }
  stage.addEventListener('touchend', endT, {passive:true});
  stage.addEventListener('touchcancel', endT, {passive:true});


  function draw(){
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform2f(uRes, cv.width, cv.height);
    gl.uniform1f(uT, T);
    gl.uniform2f(uHot, hx, hy);
    gl.uniform1f(uAmp, amp);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  function frame(ts){
    if(!running) return;
    var dt = Math.min(0.05, (ts - last) / 1000 || 0.016);
    last = ts; T += dt;
    if(!ptr){
      // 相位全部线性喂给 sin（§5.9：循环相位不缓动，非线性来自波形本身）
      tx = 0.30 * Math.sin(T * 0.21)        + 0.12 * Math.sin(T * 0.083 + 2.1);
      ty = 0.16 * Math.sin(T * 0.157 + 1.3) + 0.08 * Math.sin(T * 0.117 + 4.0);
      ta = 0.88 + 0.18 * Math.sin(T * 0.10 + 0.6);
    }
    var k = 1 - Math.exp(-dt * (ptr ? 6 : 1.2));
    hx += (tx - hx) * k; hy += (ty - hy) * k; amp += (ta - amp) * k;
    draw();
    raf = requestAnimationFrame(frame);
  }

  // prefers-reduced-motion：画一帧静止热斑，不起循环
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches){
    T = 7; hx = 0.05; hy = -0.04; amp = 0.9;
    draw();
    return;
  }

  // 离屏停 rAF（§5.5）
  new IntersectionObserver(function(en){
    var vis = en[0].isIntersecting;
    if(vis && !running){
      running = true; last = performance.now();
      raf = requestAnimationFrame(frame);
    }else if(!vis && running){
      running = false; cancelAnimationFrame(raf);
    }
  }).observe(stage);
})();
</script>
</body>
</html>
